name: SDF Analyzer — PR Check
on: pull_request
permissions:
  pull-requests: write
jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Strikaris-Tech/sdf-analyzer-pr-check@v1
        with:
          project-path: '.'
